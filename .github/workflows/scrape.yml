name: 🎮 Auto-Scrape Games

on:
  # ── Run every 2 hours automatically ──────────────────────
  schedule:
    - cron: "0 */4 * * *"

  # ── Also allow manual trigger from GitHub Actions tab ────
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed to push games.json back to repo

    steps:
      # 1. Checkout your repo
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      # 4. Run the scraper
      - name: 🕷️ Run scraper
        run: python scraper.py

      # 5. Commit and push updated games.json if anything changed
      - name: 💾 Commit & push games.json
        run: |
          git config user.name  "Lust Arcade Bot"
          git config user.email "bot@lustarcade.com"
          git add games.json
          # Only commit if games.json actually changed
          git diff --staged --quiet || git commit -m "🤖 Auto-update games.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
