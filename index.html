<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #0d0d12;
    --surface:     #15151f;
    --surface2:    #1c1c2a;
    --border:      #2a2a3d;
    --accent:      #e8305a;
    --accent2:     #ff6b35;
    --gold:        #f4c430;
    --green:       #22c55e;
    --tag-inc:     #c8a200;   /* included tag highlight */
    --tag-exc:     #e8305a;   /* excluded tag highlight */
    --text:        #e2e2ef;
    --muted:       #6e6e90;
    --tag-bg:      #1e1e30;
    --font-head:   'Rajdhani', sans-serif;
    --font-body:   'Nunito', sans-serif;
    --radius:      8px;
    --sidebar-w:   270px;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    position: sticky; top: 0; z-index: 200;
    padding: 0 20px;
    display: flex; align-items: center; gap: 16px;
    height: 56px;
    box-shadow: 0 4px 24px rgba(232,48,90,.15);
  }
  .logo {
    font-family: var(--font-head); font-size: 1.65rem; font-weight: 700;
    color: var(--text); text-decoration: none; letter-spacing: 1px; white-space: nowrap;
  }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 4px; }
  nav a {
    color: var(--muted); text-decoration: none;
    font-family: var(--font-head); font-size: .95rem; font-weight: 600;
    padding: 5px 11px; border-radius: 6px;
    transition: color .2s, background .2s;
  }
  nav a:hover { color: var(--text); background: var(--surface2); }
  .header-search {
    flex: 1; max-width: 400px; position: relative; margin-left: auto;
  }
  .header-search input {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 7px 12px 7px 34px;
    font-family: var(--font-body); font-size: 13px; outline: none;
    transition: border-color .2s;
  }
  .header-search input:focus { border-color: var(--accent); }
  .header-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(135deg, #0d0d12 0%, #1a0a14 50%, #0d0d12 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 20px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 70% 50%, rgba(232,48,90,.1) 0%, transparent 60%);
    pointer-events: none;
  }
  .hero h1 {
    font-family: var(--font-head); font-size: clamp(1.4rem, 3vw, 2.2rem);
    font-weight: 700; letter-spacing: 1px;
  }
  .hero h1 span { color: var(--accent); }
  .hero p { color: var(--muted); margin-top: 4px; font-size: 12px; }

  /* ── BODY LAYOUT: sidebar + content ── */
  .body-wrap {

  }

  /* ── SIDEBAR ── */

    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 12px 40px;
    position: sticky; top: 56px;

    overflow-y: auto;
    overflow-x: hidden;

  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .sb-row { display: flex; gap: 6px; align-items: center; }
  .sb-select {

    border-radius: 6px; color: var(--text);
    padding: 7px 10px; font-family: var(--font-body); font-size: 12px;

  .btn-reset {
    background: var(--accent); border: none; border-radius: 6px;
    width: 32px; height: 32px; cursor: pointer; color: #fff;
    display: flex; align-items: center; justify-content: center;

  .btn-reset:hover { background: #c72048; }
  .btn-apply {
    background: none; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text);
    padding: 0 14px; height: 32px; cursor: pointer;
    font-family: var(--font-head); font-size: .9rem; font-weight: 700;
    transition: border-color .2s, background .2s;
    white-space: nowrap;

  .btn-apply:hover { border-color: var(--accent); background: var(--surface2); }

  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  /* Tag group heading */
  .tag-group-title {
    font-family: var(--font-head); font-size: 1rem; font-weight: 700;
    margin-bottom: 10px; letter-spacing: .3px;
  }
  .tag-group-title.include { color: #f4c430; }
  .tag-group-title.exclude { color: var(--accent); }

  /* Tag pills in sidebar */
  .tag-pool {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-bottom: 6px;
  }
  .sp-tag {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); font-size: 11px;
    padding: 3px 9px; border-radius: 5px;
    cursor: pointer; user-select: none;
    transition: background .15s, color .15s, border-color .15s;
    line-height: 1.5;

  .sp-tag:hover { background: #2a2a40; color: var(--text); }
  .sp-tag.included {
    background: rgba(244,196,48,.15);
    border-color: var(--tag-inc);
    color: var(--tag-inc); font-weight: 600;
  }
  .sp-tag.excluded {
    background: rgba(232,48,90,.15);
    border-color: var(--tag-exc);
    color: var(--tag-exc); font-weight: 600;
  }

  /* ── MAIN CONTENT ── */
  .main-content {
    flex: 1; min-width: 0;
    padding: 20px 20px 50px;

  /* top bar */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
  }
  .section-title {
    font-family: var(--font-head); font-size: 1.1rem; font-weight: 700;
    display: flex; align-items: center; gap: 8px;

  .section-badge {
    background: var(--accent); color: #fff;
    font-size: 11px; padding: 2px 8px; border-radius: 20px;
    font-family: var(--font-body); font-weight: 600;

  .filter-count { color: var(--muted); font-size: 12px; }
  .filter-count strong { color: var(--accent); }

  /* active tag chips (applied filters) */
  .active-tags {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-bottom: 14px;

  .active-chip {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    cursor: pointer;

  .active-chip.inc { background: rgba(244,196,48,.15); border: 1px solid var(--tag-inc); color: var(--tag-inc); }
  .active-chip.exc { background: rgba(232,48,90,.15); border: 1px solid var(--tag-exc); color: var(--tag-exc); }
  .active-chip span { font-size: 13px; line-height: 1; }

  /* ── GAME GRID ── */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  /* ── GAME CARD ── */
  .game-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    cursor: pointer; text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    transition: transform .22s, border-color .22s, box-shadow .22s;
    position: relative;
  }
  .game-card:hover {
    transform: translateY(-4px); border-color: var(--accent);
    box-shadow: 0 8px 28px rgba(232,48,90,.2);
  }
  .card-img-wrap {
    position: relative; width: 100%; aspect-ratio: 16/9;
    overflow: hidden; background: #111;
  }
  .card-img-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .4s;
  }
  .game-card:hover .card-img-wrap img { transform: scale(1.06); }
  .card-status {
    position: absolute; top: 7px; left: 7px;
    background: rgba(232,48,90,.9); color: #fff;
    font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px;

  .card-views {
    position: absolute; bottom: 7px; right: 7px;
    background: rgba(0,0,0,.7); color: var(--muted);
    font-size: 10px; padding: 2px 7px; border-radius: 4px;

  .card-title {

  .card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); }

  .card-tags { display: flex; flex-wrap: wrap; gap: 3px; }

    font-size: 11px; color: var(--muted); background: var(--surface2);

  /* ── SKELETON ── */
  .skeleton { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; animation: pulse 1.4s ease-in-out infinite; }
  .skeleton-img { width: 100%; aspect-ratio: 16/9; background: var(--surface2); }
  .skeleton-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .skeleton-line { height: 11px; border-radius: 4px; background: var(--surface2); }
  .skeleton-line.w60 { width: 60%; } .skeleton-line.w40 { width: 40%; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* ── EMPTY / ERROR ── */
  .state-msg { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--muted); }
  .state-msg h3 { font-family: var(--font-head); font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }

  /* ── FOOTER ── */
  footer {
    background: var(--surface); border-top: 1px solid var(--border);

    display: flex; justify-content: space-between; align-items: center;

  footer strong { color: var(--accent); font-family: var(--font-head); font-size: 13px; }

  /* ── SIDEBAR SEARCH ── */
  .sb-search {
    position: relative; margin-bottom: 14px;
  }
  .sb-search input {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 7px 10px 7px 32px;
    font-family: var(--font-body); font-size: 12px; outline: none;
    transition: border-color .2s;
  }
  .sb-search input:focus { border-color: var(--accent); }
  .sb-search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  /* ── TWO-COLUMN FILTER GRID ── */
  .sb-grid2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 10px;
  }
  .sb-field { display: flex; flex-direction: column; gap: 4px; }
  .sb-field-label {
    font-size: 10px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .7px;
  }
  .sb-select-sm {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text);
    padding: 6px 8px; font-family: var(--font-body); font-size: 11px;
    cursor: pointer; outline: none; transition: border-color .2s; width: 100%;
  }
  .sb-select-sm:focus { border-color: var(--accent); }

  /* Tags mode row: Include / Exclude toggle */
  .sb-tags-row {
    display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px;
    align-items: end; margin-bottom: 14px;
  }
  .tag-mode-btn {
    background: var(--surface2); border: 1px solid var(--border);

  .tag-mode-btn.active-inc { background: rgba(244,196,48,.15); border-color: var(--tag-inc); color: var(--tag-inc); font-weight: 700; }
  .tag-mode-btn.active-exc { background: rgba(232,48,90,.15); border-color: var(--tag-exc); color: var(--tag-exc); font-weight: 700; }

  /* ── MOBILE SIDEBAR TOGGLE ── */
  .sidebar-toggle {
    display: none; background: var(--accent); border: none; border-radius: 6px;
    color: #fff; padding: 6px 12px; cursor: pointer;
    font-family: var(--font-head); font-size: .9rem; font-weight: 700;
    align-items: center; gap: 6px;

  @media (max-width: 820px) {
    .sidebar { display: none; position: fixed; top: 56px; left: 0; bottom: 0; z-index: 150; width: 260px; min-width: 260px; }
    .sidebar.open { display: block; box-shadow: 4px 0 24px rgba(0,0,0,.6); }
    .sidebar-toggle { display: flex; }

  }
  @media (max-width: 480px) {
    .games-grid { grid-template-columns: 1fr; }
    .header-search { max-width: 180px; }
  }
</style>

  "Male Protagonist","Management","Masturbation","MILF","Mind Control","Mobile Game",
  "Monster","Monster Girl","Multiple Endings","Multiple penetration","Multiple protagonist",
  "Necrophilia","Netorare","No Sexual Content","NTR","Oral Sex","Paranormal","Parody",
  "Platformer","Point & Click","Possession","Pov","Pregnancy","Prostitution","Puzzle",
  "Rape","Real Porn","Religion","Romance","RPG","Sandbox","Scat","School Setting",
  "Sci-Fi","Sex Toys","Sexual Harassment","Shooter","Shota","Side-Scroller","Simulator",
  "Sissification","Slave","Sleep Sex","Spanking","Strategy","Stripping","Superpowers",
  "Swinging","Teasing","Tentacles","Text Based","Titfuck","Trainer","Transformation",

];

// ── STATE ────────────────────────────────
const includedTags = new Set();
const excludedTags = new Set();
let allGames = [];

// ── ELEMENTS ─────────────────────────────
const grid           = document.getElementById('gamesGrid');
const searchInput    = document.getElementById('searchInput');
const sbSearch       = document.getElementById('sbSearch');
const sortSelect     = document.getElementById('sortSelect');
const platformFilter = document.getElementById('platformFilter');
const engineFilter   = document.getElementById('engineFilter');
const stateFilter    = document.getElementById('stateFilter');
const tagModeInc     = document.getElementById('tagModeInc');
const tagModeExc     = document.getElementById('tagModeExc');
const filterCount    = document.getElementById('filterCount');
const gameBadge      = document.getElementById('gameBadge');
const activeChips    = document.getElementById('activeTagChips');
const includePool    = document.getElementById('includeTags');
const excludePool    = document.getElementById('excludeTags');
const incSection     = document.getElementById('incSection');
const excSection     = document.getElementById('excSection');
const btnApply       = document.getElementById('btnApply');
const btnReset       = document.getElementById('btnReset');
const sidebarToggle  = document.getElementById('sidebarToggle');
const sidebar        = document.getElementById('sidebar');

// current tag panel mode: 'include' or 'exclude'
let tagMode = 'include';

// ── TAG MODE TOGGLE ───────────────────────
function setTagMode(mode) {
  tagMode = mode;
  if (mode === 'include') {
    tagModeInc.classList.add('active-inc');
    tagModeInc.textContent = 'Include ▲';
    tagModeExc.classList.remove('active-exc');
    tagModeExc.textContent = 'Exclude';
    incSection.style.display = '';
    excSection.style.display = 'none';
  } else {
    tagModeExc.classList.add('active-exc');
    tagModeExc.textContent = 'Exclude ▲';
    tagModeInc.classList.remove('active-inc');
    tagModeInc.textContent = 'Include';
    excSection.style.display = '';
    incSection.style.display = 'none';
  }
}

tagModeInc.addEventListener('click', () => setTagMode('include'));
tagModeExc.addEventListener('click', () => setTagMode('exclude'));

// ── BUILD TAG POOLS ──────────────────────
function buildTagPools() {
  includePool.innerHTML = '';
  excludePool.innerHTML = '';

  ALL_TAGS.forEach(tag => {
    // Include pill
    const incEl = document.createElement('span');
    incEl.className = 'sp-tag';
    incEl.textContent = tag;
    if (includedTags.has(tag)) incEl.classList.add('included');
    incEl.addEventListener('click', () => toggleInclude(tag));
    includePool.appendChild(incEl);

    // Exclude pill
    const excEl = document.createElement('span');
    excEl.className = 'sp-tag';
    excEl.textContent = tag;
    if (excludedTags.has(tag)) excEl.classList.add('excluded');
    excEl.addEventListener('click', () => toggleExclude(tag));
    excludePool.appendChild(excEl);
  });
}

function toggleInclude(tag) {
  if (includedTags.has(tag)) { includedTags.delete(tag); }
  else { includedTags.add(tag); excludedTags.delete(tag); }
  refreshTagUI();
}

function toggleExclude(tag) {
  if (excludedTags.has(tag)) { excludedTags.delete(tag); }
  else { excludedTags.add(tag); includedTags.delete(tag); }
  refreshTagUI();
}

function refreshTagUI() {
  // Update pill states without full rebuild (performance)
  includePool.querySelectorAll('.sp-tag').forEach((el, i) => {
    const tag = ALL_TAGS[i];
    el.classList.toggle('included', includedTags.has(tag));
    el.classList.remove('excluded');
  });
  excludePool.querySelectorAll('.sp-tag').forEach((el, i) => {
    const tag = ALL_TAGS[i];
    el.classList.toggle('excluded', excludedTags.has(tag));
    el.classList.remove('included');
  });
  renderActiveChips();
  applyFilters();
}

function renderActiveChips() {
  activeChips.innerHTML = '';
  includedTags.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'active-chip inc';
    chip.innerHTML = `✓ ${tag} <span>×</span>`;
    chip.addEventListener('click', () => toggleInclude(tag));
    activeChips.appendChild(chip);
  });
  excludedTags.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'active-chip exc';
    chip.innerHTML = `✕ ${tag} <span>×</span>`;
    chip.addEventListener('click', () => toggleExclude(tag));
    activeChips.appendChild(chip);
  });
}

// ── HELPERS ──────────────────────────────
function stars(rating = 0) {
  const r = Math.round(rating); let s = '';
  for (let i = 1; i <= 5; i++) s += i <= r ? '★' : '☆';
  return s;
}

// ── BUILD CARD ───────────────────────────
function buildCard(g) {
  const tags  = (g.tags || []).slice(0, 5).map(t => `<span class="ctag">${t}</span>`).join('');
  const cover = g.cover || 'https://via.placeholder.com/400x225/15151f/6e6e90?text=No+Image';
  const sc    = (g.status || '').toLowerCase() === 'completed' ? 'completed' : '';

  const a = document.createElement('a');
  a.className = 'game-card';
  a.href = `details.html?id=${encodeURIComponent(g.id)}`;
  a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.setAttribute('aria-label', g.title);

  a.innerHTML = `
    <div class="card-img-wrap">
      <img src="${cover}" alt="${g.title}" loading="lazy"
           onerror="this.src='https://via.placeholder.com/400x225/15151f/6e6e90?text=No+Image'"/>
      <span class="card-status ${sc}">${g.status || 'Unknown'}</span>
      <span class="card-views">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        ${g.views || '—'}
      </span>
    </div>
    <div class="card-body">
      <div class="card-title">${g.title || 'Untitled'}</div>
      <div class="card-meta">
        <span class="dev">${g.developer || 'Unknown'}</span>
        <span class="ver">${g.version || ''}</span>
      </div>
      <div class="card-stars">${stars(g.rating)}<span>(${g.votes || 0})</span></div>
      <div class="card-tags">${tags}</div>
    </div>
    <div class="card-footer">
      <span>${g.engine || '—'}</span>
      <span>${g.release_date || '—'}</span>
    </div>`;
  return a;
}

// ── RENDER ───────────────────────────────
function renderGames(list) {
  grid.innerHTML = '';
  if (!list || list.length === 0) {
    grid.innerHTML = `<div class="state-msg"><h3>No games found</h3><p>Try adjusting your filters or tags.</p></div>`;
    filterCount.innerHTML = ''; gameBadge.textContent = '0'; return;
  }
  const frag = document.createDocumentFragment();
  list.forEach(g => frag.appendChild(buildCard(g)));
  grid.appendChild(frag);
  filterCount.innerHTML = `Showing <strong>${list.length}</strong> game${list.length !== 1 ? 's' : ''}`;
  gameBadge.textContent = list.length;
}

// ── FILTER + SORT ────────────────────────
function applyFilters() {
  const q        = (searchInput.value || sbSearch.value).trim().toLowerCase();
  const sort     = sortSelect.value;
  const platform = platformFilter.value;
  const engine   = engineFilter.value;
  const state    = stateFilter.value;

  let list = allGames.filter(g => {
    const gameTags = (g.tags || []).map(t => t.toLowerCase());

    // Search
    if (q && !((g.title||'').toLowerCase().includes(q) ||
               (g.developer||'').toLowerCase().includes(q) ||
               gameTags.some(t => t.includes(q)))) return false;

    // Platform (game must list it in download_links or platforms array)
    if (platform) {
      const plats = (g.platforms || []).concat(
        (g.download_links||[]).map(d => d.platform||'')
      ).map(p => p.toLowerCase());
      if (!plats.includes(platform.toLowerCase())) return false;
    }

    // Engine
    if (engine && (g.engine||'') !== engine) return false;

    // State / Status
    if (state && (g.status||'') !== state) return false;

    // Must have ALL included tags
    for (const inc of includedTags) {
      if (!gameTags.includes(inc.toLowerCase())) return false;
    }

    // Must NOT have ANY excluded tags
    for (const exc of excludedTags) {
      if (gameTags.includes(exc.toLowerCase())) return false;
    }

    return true;
  });

  if (sort === 'views') {
    list.sort((a,b) => parseFloat((b.views||'0').replace(/[^0-9.]/g,'')) - parseFloat((a.views||'0').replace(/[^0-9.]/g,'')));
  } else if (sort === 'rating') {
    list.sort((a,b) => (b.rating||0) - (a.rating||0));
  } else if (sort === 'az') {
    list.sort((a,b) => (a.title||'').localeCompare(b.title||''));
  }

  renderGames(list);
}

// ── RESET ────────────────────────────────
function resetAll() {
  includedTags.clear(); excludedTags.clear();
  searchInput.value = ''; sbSearch.value = '';
  sortSelect.value = 'default';
  platformFilter.value = ''; engineFilter.value = ''; stateFilter.value = '';
  setTagMode('include');
  buildTagPools(); renderActiveChips(); applyFilters();
}

// ── FETCH DATA ───────────────────────────
async function loadGames() {
  try {
    const res = await fetch('games.json');
    if (!res.ok) throw new Error('Failed to load games.json');
    allGames = await res.json();
    renderGames(allGames);
    gameBadge.textContent = allGames.length;
  } catch (err) {
    grid.innerHTML = `
      <div class="state-msg">
        <h3>⚠ Could not load games</h3>
        <p>${err.message}</p>
        <p style="margin-top:8px;font-size:11px;">Make sure <code>games.json</code> is in the same folder.</p>
      </div>`;
  }
}

// ── EVENTS ───────────────────────────────
searchInput.addEventListener('input', applyFilters);
sbSearch.addEventListener('input', applyFilters);
btnApply.addEventListener('click', applyFilters);
sortSelect.addEventListener('change', applyFilters);
platformFilter.addEventListener('change', applyFilters);
engineFilter.addEventListener('change', applyFilters);
stateFilter.addEventListener('change', applyFilters);
btnReset.addEventListener('click', resetAll);

// Mobile sidebar toggle
sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
document.addEventListener('click', e => {
  if (!sidebar.contains(e.target) && e.target !== sidebarToggle) {
    sidebar.classList.remove('open');
  }
});

// ── INIT ─────────────────────────────────
setTagMode('include');
buildTagPools();
loadGames();
</script>
