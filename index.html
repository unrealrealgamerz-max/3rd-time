<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LustArcade - Discover & Download Games</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d14;--bg2:#0a0a12;--bg3:#13131f;--bg4:#1a1a28;
  --bd:#2a2a3e;--acc:#e84393;--acc2:#7c3aed;
  --txt:#c8c8d8;--mu:#6b6b8a;--white:#ffffff;
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer}

/* HEADER */
.header{
  background:var(--bg2);border-bottom:1px solid var(--bd);
  padding:0 20px;display:flex;align-items:center;gap:20px;
  height:52px;position:sticky;top:0;z-index:100;
}
.logo{font-size:18px;font-weight:800;color:var(--white);display:flex;align-items:center;gap:6px}
.logo .gz{color:var(--acc)}
.nav{display:flex;gap:4px;margin-left:10px}
.nav a{color:var(--mu);font-size:13px;padding:5px 10px;border-radius:5px;transition:.15s}
.nav a:hover,.nav a.active{color:var(--white);background:#1e1e30}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search-top{
  background:var(--bg4);border:1px solid var(--bd);color:var(--txt);
  padding:6px 12px;border-radius:20px;font-size:12px;width:200px;outline:none;
}
.search-top:focus{border-color:var(--acc2);width:260px;transition:.2s}
.sign-btn{
  background:var(--acc2);border:none;color:var(--white);
  padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;
}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 52px)}

/* SIDEBAR */
.sidebar{
  width:230px;flex-shrink:0;border-right:1px solid var(--bd);
  background:var(--bg2);display:flex;flex-direction:column;
  position:sticky;top:52px;height:calc(100vh - 52px);
}
.sb-scroll{flex:1;overflow-y:auto;padding:12px}
.sb-scroll::-webkit-scrollbar{width:3px}
.sb-scroll::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.sb-bottom{padding:10px 12px;border-top:1px solid var(--bd)}
.sb-label{
  font-size:10px;font-weight:700;color:var(--mu);
  text-transform:uppercase;letter-spacing:1px;
  margin:12px 0 6px;
}
.sb-label:first-child{margin-top:0}
.sb-select{
  width:100%;background:var(--bg4);border:1px solid var(--bd);
  color:var(--txt);padding:6px 8px;border-radius:6px;
  font-size:11px;margin-bottom:5px;outline:none;
}
.tag-search-input{
  width:100%;background:var(--bg4);border:1px solid var(--bd);
  color:var(--txt);padding:5px 8px;border-radius:5px;
  font-size:11px;outline:none;margin-bottom:6px;
}
.tags-wrap{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.ftag{
  background:var(--bg4);border:1px solid var(--bd);
  border-radius:4px;font-size:10px;color:var(--mu);
  padding:3px 7px;cursor:pointer;user-select:none;transition:.1s;
  white-space:nowrap;
}
.ftag:hover{border-color:#5b6cf8;color:#c0c8ff}
.ftag.inc-on{background:#1c1c44;border-color:#5b6cf8;color:#8fa3ff}
.ftag.exc-on{background:#2a0808;border-color:#ef4444;color:#fca5a5}
.apply-btn{
  width:100%;padding:8px;background:var(--acc2);border:none;
  border-radius:6px;color:var(--white);font-size:12px;
  font-weight:700;margin-bottom:6px;transition:.15s;
}
.apply-btn:hover{background:#6d28d9}
.reset-btn{
  width:100%;padding:6px;background:transparent;
  border:1px solid var(--bd);border-radius:6px;
  color:var(--mu);font-size:11px;transition:.15s;
}
.reset-btn:hover{color:var(--white);border-color:var(--acc2)}

/* MAIN */
.main{flex:1;padding:18px;overflow-x:hidden}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-title{font-size:17px;font-weight:700;color:var(--white);flex:1}
.result-count{font-size:12px;color:var(--mu)}
.sort-sel{
  background:var(--bg4);border:1px solid var(--bd);
  color:var(--txt);padding:5px 8px;border-radius:5px;font-size:11px;outline:none;
}

/* GAME CARDS */
.games-list{display:flex;flex-direction:column;gap:12px}
.game-card{
  background:var(--bg3);border:1px solid var(--bd);
  border-radius:10px;display:flex;overflow:hidden;
  cursor:pointer;transition:.15s;
}
.game-card:hover{border-color:#4a4a70;background:#15152a;transform:translateY(-1px)}
.card-thumb{
  width:200px;flex-shrink:0;height:130px;
  position:relative;overflow:hidden;background:var(--bg4);
}
.card-thumb img{width:100%;height:100%;object-fit:cover;transition:.2s}
.game-card:hover .card-thumb img{transform:scale(1.05)}
.card-thumb .no-img{
  width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;font-size:40px;
}
.img-count{
  position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);
  border-radius:4px;font-size:10px;color:var(--txt);padding:2px 6px;
}
.new-badge{
  position:absolute;top:6px;right:6px;background:var(--acc);
  border-radius:4px;font-size:9px;color:var(--white);
  padding:2px 6px;font-weight:700;
}
.refresh-icon{
  position:absolute;bottom:5px;right:5px;
  background:rgba(0,0,0,.6);border-radius:50%;
  width:22px;height:22px;display:flex;align-items:center;
  justify-content:center;font-size:11px;color:var(--mu);
}
.card-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px}
.game-title{font-size:14px;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-version{font-size:11px;color:var(--acc);font-weight:600;flex-shrink:0}
.game-author{font-size:11px;color:var(--mu);margin-bottom:6px}
.game-author span{color:#c084fc}
.game-desc{
  font-size:11px;color:#7878a0;line-height:1.5;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.ctag{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600}
.t-3d{background:#12203a;color:#60a5fa;border:1px solid #1d3356}
.t-dcg{background:#1a1230;color:#a78bfa;border:1px solid #2d1f4a}
.t-anim{background:#0f1a0f;color:#86efac;border:1px solid #1a3020}
.t-rpg{background:#1a0f0f;color:#fca5a5;border:1px solid #3a1515}
.t-vn{background:#1a1a0a;color:#fde68a;border:1px solid #3a3010}
.t-sci{background:#0a1a1a;color:#67e8f9;border:1px solid #0f3040}
.t-gen{background:#1e1530;color:#c084fc;border:1px solid #2a1845}
.t-more{background:#1e1e30;color:var(--mu);border:1px solid var(--bd)}
.card-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plat-badge{font-size:9px;color:var(--mu);background:#1e1e30;padding:2px 6px;border-radius:3px}
.views{font-size:10px;color:var(--mu);margin-left:auto}
.updated{font-size:9px;color:#444460}
.state-badge{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600}
.state-ongoing{background:#1a1a0a;color:#fde68a;border:1px solid #3a3010}
.state-completed{background:#0a1a0a;color:#86efac;border:1px solid #1a3a1a}
.state-abandoned{background:#1a0a0a;color:#fca5a5;border:1px solid #3a1a1a}

/* NO RESULTS */
.no-results{text-align:center;padding:60px 20px;color:var(--mu)}
.no-results .icon{font-size:50px;margin-bottom:12px}

/* PAGINATION */
.pagination{display:flex;gap:5px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.pg-btn{
  background:var(--bg4);border:1px solid var(--bd);color:var(--txt);
  padding:6px 11px;border-radius:5px;font-size:11px;
}
.pg-btn:hover{border-color:var(--acc2);color:var(--white)}
.pg-btn.active{background:var(--acc2);border-color:var(--acc2);color:var(--white)}
.pg-btn:disabled{opacity:.3;cursor:default}

/* MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
  z-index:1000;overflow-y:auto;padding:20px;
}
.modal-overlay.open{display:flex;align-items:flex-start;justify-content:center}
.modal{
  background:var(--bg2);border:1px solid var(--bd);border-radius:14px;
  width:100%;max-width:780px;overflow:hidden;margin:auto;
  animation:slideUp .2s ease;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{position:relative}
.modal-banner{width:100%;height:260px;object-fit:cover;display:block}
.modal-banner-placeholder{
  width:100%;height:260px;background:var(--bg4);
  display:flex;align-items:center;justify-content:center;font-size:80px;
}
.modal-close{
  position:absolute;top:12px;right:12px;background:rgba(0,0,0,.7);
  border:none;color:var(--white);width:32px;height:32px;
  border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:rgba(255,0,0,.5)}
.modal-gallery{display:flex;gap:6px;padding:10px 16px;background:#0a0a10;overflow-x:auto}
.modal-gallery img{height:60px;border-radius:5px;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.modal-gallery img:hover,.modal-gallery img.active{border-color:var(--acc)}
.modal-body{padding:18px}
.modal-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.modal-title{font-size:20px;font-weight:800;color:var(--white)}
.modal-ver{font-size:13px;color:var(--acc);font-weight:700}
.modal-author{font-size:12px;color:var(--mu);margin-bottom:10px}
.modal-author span{color:#c084fc}
.modal-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.modal-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.modal-desc{font-size:12px;color:#9090b0;line-height:1.7;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.dl-btn{
  flex:1;padding:11px;background:var(--acc);border:none;
  color:var(--white);border-radius:8px;font-size:13px;
  font-weight:700;text-align:center;transition:.15s;
}
.dl-btn:hover{background:#c73380}
.dl-btn.secondary{background:var(--acc2)}
.dl-btn.secondary:hover{background:#6d28d9}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--mu)}
.spinner{
  width:36px;height:36px;border:3px solid var(--bd);
  border-top-color:var(--acc2);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{display:none}
  .card-thumb{width:120px;height:90px}
  .search-top{width:150px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">🎮 <span class="gz">Lust</span>Arcade</div>
  <nav class="nav">
    <a href="#" class="active">Games</a>
    <a href="#">Forum</a>
    <a href="#">Rankings</a>
    <a href="#">New</a>
  </nav>
  <div class="header-right">
    <input class="search-top" type="text" id="top-search" placeholder="🔍 Search games..." oninput="applyFilters()">
    <button class="sign-btn">Sign In</button>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-scroll">
      <div class="sb-label">Platform</div>
      <select class="sb-select" id="f-platform" onchange="applyFilters()">
        <option value="">All Platforms</option>
        <option>Windows</option><option>Mac</option>
        <option>Linux</option><option>Android</option>
      </select>

      <div class="sb-label">Engine</div>
      <select class="sb-select" id="f-engine" onchange="applyFilters()">
        <option value="">All Engines</option>
        <option>Unity</option><option>Unreal Engine</option>
        <option>Other</option><option>RPGM</option>
        <option>Ren'py</option><option>HTML</option>
      </select>

      <div class="sb-label">State</div>
      <select class="sb-select" id="f-state" onchange="applyFilters()">
        <option value="">All States</option>
        <option>Completed</option><option>Ongoing</option><option>Abandoned</option>
      </select>

      <div class="sb-label">Sort By</div>
      <select class="sb-select" id="f-sort" onchange="applyFilters()">
        <option value="updated">Last Update</option>
        <option value="views">Most Views</option>
        <option value="alpha">A–Z</option>
        <option value="newest">Newest First</option>
      </select>

      <div class="sb-label">Include Tags</div>
      <input class="tag-search-input" type="text" placeholder="Search tags..." oninput="filterTagDisplay(this,'inc-wrap')">
      <div class="tags-wrap" id="inc-wrap"></div>

      <div class="sb-label">Exclude Tags</div>
      <input class="tag-search-input" type="text" placeholder="Search tags..." oninput="filterTagDisplay(this,'exc-wrap')">
      <div class="tags-wrap" id="exc-wrap"></div>
    </div>
    <div class="sb-bottom">
      <button class="apply-btn" onclick="applyFilters()">✓ Apply Filters</button>
      <button class="reset-btn" onclick="resetFilters()">↺ Reset All</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="page-title" id="page-title">All Games</div>
      <span class="result-count" id="result-count">Loading...</span>
    </div>
    <div id="games-container">
      <div class="loading"><div class="spinner"></div>Loading games...</div>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

<!-- GAME MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <img class="modal-banner" id="modal-banner" src="" alt="" onerror="this.style.display='none';document.getElementById('modal-banner-ph').style.display='flex'">
      <div class="modal-banner-placeholder" id="modal-banner-ph" style="display:none">🎮</div>
      <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-gallery" id="modal-gallery"></div>
    <div class="modal-body">
      <div class="modal-title-row">
        <div class="modal-title" id="modal-title">Game Title</div>
        <div class="modal-ver" id="modal-ver">v1.0</div>
      </div>
      <div class="modal-author" id="modal-author">by <span>Author</span></div>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <div class="modal-tags" id="modal-tags"></div>
      <div class="modal-actions">
        <a class="dl-btn" id="modal-dl" href="#" target="_blank" rel="noopener">⬇ Download / Play</a>
        <a class="dl-btn secondary" id="modal-link" href="#" target="_blank" rel="noopener">🔗 Game Page</a>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// ALL TAGS
// ============================================================
const ALL_TAGS = [
  "2D Game","2DCG","3D Game","3DCG","Adventure","Ahegao","AI CG","Anal Sex",
  "Animated","BDSM","Bestiality","Big Ass","Big Tits","Blackmail","Bukkake",
  "Censored","Character Creation","Cheating","Combat","Corruption","Cosplay",
  "Creampie","Dating Sim","DCG","DILF","Drugs","Dystopian Setting",
  "Exhibitionism","Fantasy","Female Domination","Female Protagonist",
  "Footjob","Furry","Futa/Trans","Futa/Trans Protagonist","Gay",
  "Graphic Violence","Groping","Group Sex","Handjob","Harem","Horror",
  "Humiliation","Humor","Incest","Internal View","Interracial",
  "Japanese Game","Kinetic Novel","Lactation","Lesbian","Loli",
  "Male Domination","Male Protagonist","Management","Masturbation",
  "MILF","Mind Control","Mobile Game","Monster","Monster Girl",
  "Multiple Endings","Multiple Penetration","Multiple Protagonist",
  "Necrophilia","Netorare","No Sexual Content","NTR","Oral Sex",
  "Paranormal","Parody","Platformer","Point & Click","Possession",
  "POV","Pregnancy","Prostitution","Puzzle","Rape","Real Porn",
  "Religion","Romance","RPG","Sandbox","Scat","School Setting",
  "Sci-Fi","Sex Toys","Sexual Harassment","Shooter","Shota",
  "Side-Scroller","Simulator","Sissification","Slave","Sleep Sex",
  "Spanking","Strategy","Stripping","Superpowers","Swinging",
  "Teasing","Tentacles","Text Based","Titfuck","Trainer",
  "Transformation","Trap","Turn Based Combat","Twins","Urination",
  "Vaginal Sex","Virgin","Virtual Reality","Visual Novel",
  "Voiced","Vore","Voyeurism"
];

// ============================================================
// TAG COLOR LOGIC
// ============================================================
function tagClass(t) {
  if(["3D Game","2D Game"].includes(t)) return "t-3d";
  if(["3DCG","2DCG","AI CG","DCG"].includes(t)) return "t-dcg";
  if(t === "Animated") return "t-anim";
  if(["RPG","Turn Based Combat","Strategy","Platformer","Shooter","Puzzle","Sandbox","Simulator","Side-Scroller","Point & Click","Management"].includes(t)) return "t-rpg";
  if(["Visual Novel","Kinetic Novel","Dating Sim","Text Based","Kinetic Novel"].includes(t)) return "t-vn";
  if(["Sci-Fi","Virtual Reality","Dystopian Setting","Mobile Game"].includes(t)) return "t-sci";
  return "t-gen";
}

// ============================================================
// STATE
// ============================================================
let allGames = [];
let filtered = [];
let incTags = new Set();
let excTags = new Set();
let currentPage = 1;
const PER_PAGE = 8;

// ============================================================
// BUILD SIDEBAR TAGS
// ============================================================
function buildSidebarTags() {
  const iw = document.getElementById('inc-wrap');
  const ew = document.getElementById('exc-wrap');
  iw.innerHTML = ALL_TAGS.map(t =>
    `<span class="ftag ${incTags.has(t)?'inc-on':''}" data-tag="${t}" onclick="toggleTag(this,'inc')">${t}</span>`
  ).join('');
  ew.innerHTML = ALL_TAGS.map(t =>
    `<span class="ftag ${excTags.has(t)?'exc-on':''}" data-tag="${t}" onclick="toggleTag(this,'exc')">${t}</span>`
  ).join('');
}

function filterTagDisplay(inp, wrapperId) {
  const q = inp.value.toLowerCase();
  document.querySelectorAll('#'+wrapperId+' .ftag').forEach(el => {
    el.style.display = el.dataset.tag.toLowerCase().includes(q) ? '' : 'none';
  });
}

function toggleTag(el, mode) {
  const tag = el.dataset.tag;
  if(mode === 'inc') {
    if(incTags.has(tag)) { incTags.delete(tag); el.classList.remove('inc-on'); }
    else { incTags.add(tag); el.classList.add('inc-on'); excTags.delete(tag); rebuildExcUI(); }
  } else {
    if(excTags.has(tag)) { excTags.delete(tag); el.classList.remove('exc-on'); }
    else { excTags.add(tag); el.classList.add('exc-on'); incTags.delete(tag); rebuildIncUI(); }
  }
}
function rebuildIncUI(){
  document.querySelectorAll('#inc-wrap .ftag').forEach(el=>{
    el.classList.toggle('inc-on', incTags.has(el.dataset.tag));
  });
}
function rebuildExcUI(){
  document.querySelectorAll('#exc-wrap .ftag').forEach(el=>{
    el.classList.toggle('exc-on', excTags.has(el.dataset.tag));
  });
}

// ============================================================
// LOAD GAMES FROM games.json
// ============================================================
async function loadGames() {
  try {
    const res = await fetch('./games.json?t='+Date.now());
    allGames = await res.json();
  } catch(e) {
    // Fallback sample data for testing
    allGames = getSampleGames();
  }
  applyFilters();
}

// ============================================================
// FILTER + RENDER
// ============================================================
function applyFilters() {
  const plat  = document.getElementById('f-platform').value;
  const eng   = document.getElementById('f-engine').value;
  const state = document.getElementById('f-state').value;
  const sort  = document.getElementById('f-sort').value;
  const q     = (document.getElementById('top-search').value||'').toLowerCase().trim();
  const inc   = [...incTags];
  const exc   = [...excTags];

  filtered = allGames.filter(g => {
    if(plat  && !(g.platforms||[]).includes(plat)) return false;
    if(eng   && g.engine !== eng) return false;
    if(state && g.state  !== state) return false;
    if(q && !g.title.toLowerCase().includes(q) && !(g.author||'').toLowerCase().includes(q)) return false;
    if(inc.length && !inc.every(t => (g.tags||[]).includes(t))) return false;
    if(exc.length && exc.some(t  => (g.tags||[]).includes(t))) return false;
    return true;
  });

  if(sort==='views')   filtered.sort((a,b)=>(b.views||0)-(a.views||0));
  else if(sort==='updated') filtered.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  else if(sort==='alpha')   filtered.sort((a,b)=>a.title.localeCompare(b.title));
  else filtered.sort((a,b)=>(b.added||'').localeCompare(a.added||''));

  currentPage = 1;
  renderGames();
}

function renderGames() {
  const container = document.getElementById('games-container');
  const total = filtered.length;
  const start = (currentPage-1)*PER_PAGE;
  const pageGames = filtered.slice(start, start+PER_PAGE);

  document.getElementById('result-count').textContent = total+' game'+(total!==1?'s':'');

  const inc = [...incTags];
  document.getElementById('page-title').textContent =
    inc.length ? inc.slice(0,4).join(' · ')+' Games' : 'All Games';

  if(!total) {
    container.innerHTML = `<div class="no-results"><div class="icon">🔍</div><div style="font-size:16px;margin-bottom:6px;color:#c8c8d8">No games found</div><div>Try removing some filters or search differently</div></div>`;
    document.getElementById('pagination').innerHTML='';
    return;
  }

  container.innerHTML = `<div class="games-list">${pageGames.map(g => gameCard(g)).join('')}</div>`;
  renderPagination(total);
}

function gameCard(g) {
  const thumb = (g.images&&g.images[0]) ? `<img src="${g.images[0]}" alt="${g.title}" onerror="this.parentElement.innerHTML='<div class=no-img>🎮</div>'">` : `<div class="no-img">🎮</div>`;
  const tags  = (g.tags||[]).slice(0,5).map(t=>`<span class="ctag ${tagClass(t)}">${t}</span>`).join('');
  const extra = (g.tags||[]).length>5 ? `<span class="ctag t-more">+${g.tags.length-5}</span>` : '';
  const plats = (g.platforms||[]).map(p=>`<span class="plat-badge">${p.slice(0,3)}</span>`).join('');
  const v     = (g.views||0)>=1000 ? ((g.views/1000).toFixed(1)+'K') : String(g.views||0);
  const sc    = g.state==='Completed'?'state-completed':g.state==='Abandoned'?'state-abandoned':'state-ongoing';
  const isNew = g.added && (new Date()-new Date(g.added)) < 7*24*60*60*1000;
  return `
  <div class="game-card" onclick="openModal(${g.id})">
    <div class="card-thumb">
      ${thumb}
      ${isNew?'<span class="new-badge">NEW</span>':''}
      ${g.images&&g.images.length>1?`<span class="img-count">📷 ${g.images.length}</span>`:''}
    </div>
    <div class="card-body">
      <div>
        <div class="card-top">
          <span class="game-title">${g.title}</span>
          <span class="game-version">${g.version||''}</span>
        </div>
        <div class="game-author">by <span>${g.author||'Unknown'}</span>
          &nbsp;·&nbsp;<span class="state-badge ${sc}">${g.state||'Ongoing'}</span>
        </div>
        <div class="game-desc">${g.description||'No description available.'}</div>
        <div class="card-tags">${tags}${extra}</div>
      </div>
      <div class="card-footer">
        ${plats}
        <span class="views">👁 ${v}</span>
        <span class="updated">Updated ${g.updated||g.added||''}</span>
      </div>
    </div>
  </div>`;
}

function renderPagination(total) {
  const pages = Math.ceil(total/PER_PAGE);
  const pg = document.getElementById('pagination');
  if(pages<=1){pg.innerHTML='';return;}
  let h = `<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;
  const s=Math.max(1,currentPage-2), e=Math.min(pages,currentPage+2);
  if(s>1) h+=`<button class="pg-btn" onclick="goPage(1)">1</button>${s>2?'<span style="color:var(--mu);padding:0 4px">…</span>':''}`;
  for(let i=s;i<=e;i++) h+=`<button class="pg-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if(e<pages) h+=`${e<pages-1?'<span style="color:var(--mu);padding:0 4px">…</span>':''}<button class="pg-btn" onclick="goPage(${pages})">${pages}</button>`;
  h+=`<button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>Next ›</button>`;
  pg.innerHTML=h;
}

function goPage(p) {
  const pages=Math.ceil(filtered.length/PER_PAGE);
  if(p<1||p>pages) return;
  currentPage=p; renderGames();
  window.scrollTo(0,0);
}

// ============================================================
// MODAL
// ============================================================
function openModal(id) {
  const g = allGames.find(x=>x.id===id);
  if(!g) return;

  const banner = document.getElementById('modal-banner');
  const bannerPh = document.getElementById('modal-banner-ph');
  if(g.images&&g.images[0]) {
    banner.src=g.images[0]; banner.style.display='block'; bannerPh.style.display='none';
  } else {
    banner.style.display='none'; bannerPh.style.display='flex';
  }

  // Gallery
  const gal = document.getElementById('modal-gallery');
  if(g.images&&g.images.length>1) {
    gal.innerHTML = g.images.map((img,i)=>
      `<img src="${img}" class="${i===0?'active':''}" onclick="switchBanner('${img}',this)" alt="Screenshot ${i+1}">`
    ).join('');
    gal.style.display='flex';
  } else { gal.style.display='none'; }

  document.getElementById('modal-title').textContent = g.title;
  document.getElementById('modal-ver').textContent = g.version||'';
  document.getElementById('modal-author').innerHTML = `by <span>${g.author||'Unknown'}</span>`;
  document.getElementById('modal-desc').textContent = g.description||'No description available.';

  const meta = document.getElementById('modal-meta');
  meta.innerHTML = [
    g.state?`<span class="state-badge ${g.state==='Completed'?'state-completed':g.state==='Abandoned'?'state-abandoned':'state-ongoing'}">${g.state}</span>`:'',
    g.engine?`<span class="plat-badge">${g.engine}</span>`:'',
    ...(g.platforms||[]).map(p=>`<span class="plat-badge">${p}</span>`),
    g.views?`<span class="plat-badge">👁 ${g.views>=1000?(g.views/1000).toFixed(1)+'K':g.views}</span>`:'',
  ].filter(Boolean).join('');

  document.getElementById('modal-tags').innerHTML = (g.tags||[]).map(t=>
    `<span class="ctag ${tagClass(t)}">${t}</span>`
  ).join('');

  const dlUrl = g.download_url||g.url||'#';
  document.getElementById('modal-dl').href = dlUrl;
  document.getElementById('modal-link').href = g.url||dlUrl;

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}

function switchBanner(src,el) {
  document.getElementById('modal-banner').src=src;
  document.getElementById('modal-banner').style.display='block';
  document.getElementById('modal-banner-ph').style.display='none';
  document.querySelectorAll('.modal-gallery img').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
}

function closeModal(e) {
  if(e.target===document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow='';
  }
}
